name: Lira 24/7 Viral Content Engine

on:
  schedule:
    # 07:30 WIB (Asia/Jakarta) = 00:30 UTC
    # 12:30 WIB (Asia/Jakarta) = 05:30 UTC
    # 18:30 WIB (Asia/Jakarta) = 11:30 UTC
    - cron: '30 0,5,11 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run Mode (simulate without publishing to live Instagram)'
        type: boolean
        default: false
      format:
        description: 'Content Format (auto, reel, carousel)'
        type: choice
        options:
          - auto
          - reel
          - carousel
        default: auto
      template:
        description: 'Slot Blueprint Index (1 to 10, or leave empty for automatic sequence)'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  run-engine:
    name: Generate & Stage/Publish Content
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -n 1

      - name: Install Cloudflare Tunnel (cloudflared)
        run: |
          sudo curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Install Node Dependencies
        run: npm install

      - name: Validate Cloud Secrets for Live Publish
        if: github.event.inputs.dry_run != 'true'
        run: |
          BUFFER_VAL="${{ secrets.BUFFER_TOKEN || secrets.BUFFERTOKEN }}"
          ELEVEN_VAL="${{ secrets.ELEVENLABS_API_KEY || secrets.ELEVENLABS }}"
          MISSING=0
          if [ -z "$BUFFER_VAL" ]; then
            echo "::error::BUFFER_TOKEN (or BUFFERTOKEN) secret is missing in GitHub repository settings!"
            MISSING=1
          fi
          if [ -z "$ELEVEN_VAL" ]; then
            echo "::error::ELEVENLABS_API_KEY (or ELEVENLABS) secret is missing in GitHub repository settings!"
            MISSING=1
          fi
          if [ "$MISSING" -eq 1 ]; then
            echo "=========================================================================="
            echo "To enable 24/7 autonomous publishing on GitHub Actions, you must add these"
            echo "secrets to your GitHub repository (Repo Settings > Secrets and variables > Actions):"
            echo "- BUFFER_TOKEN (or BUFFERTOKEN)"
            echo "- ELEVENLABS_API_KEY (or ELEVENLABS)"
            echo "=========================================================================="
            exit 1
          fi
          echo "✓ All required cloud secrets verified for live autonomous dispatch."

      - name: Execute Lira Content Automator
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN || secrets.BUFFERTOKEN }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID || '6ad933a2778b240e2f81b45d' }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY || secrets.ELEVENLABS }}
          CALEB_VOICE_ID: ${{ secrets.CALEB_VOICE_ID || 'WVwVlhKdnZoCuTIoxjYr' }}
          CALEB_SECRET: ${{ secrets.CALEB }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # If CALEB_SECRET contains a multi-line .env format, parse its keys safely
          if printf '%s' "$CALEB_SECRET" | grep -q '='; then
            while IFS='=' read -r key val || [ -n "$key" ]; do
              key="$(printf '%s' "$key" | tr -d ' \t\r\n')"
              val="$(printf '%s' "$val" | tr -d '\r\n')"
              if [ -n "$key" ] && [ -n "$val" ] && [ "${key#\#}" = "$key" ]; then
                export "$key"="$val"
              fi
            done <<< "$CALEB_SECRET"
          fi

          # Sanitize environment variables against unwanted newlines/carriage returns
          export BUFFER_TOKEN="$(printf '%s' "$BUFFER_TOKEN" | tr -d '\r\n')"
          export BUFFER_CHANNEL_ID="$(printf '%s' "$BUFFER_CHANNEL_ID" | tr -d '\r\n')"
          export ELEVENLABS_API_KEY="$(printf '%s' "$ELEVENLABS_API_KEY" | tr -d '\r\n')"
          export CALEB_VOICE_ID="$(printf '%s' "$CALEB_VOICE_ID" | tr -d '\r\n')"
          export GEMINI_API_KEY="$(printf '%s' "$GEMINI_API_KEY" | tr -d '\r\n')"

          # Enforce canonical voice ID if CALEB_VOICE_ID is invalid, contains =, or is too long
          if [ -z "$CALEB_VOICE_ID" ] || printf '%s' "$CALEB_VOICE_ID" | grep -q '=' || [ ${#CALEB_VOICE_ID} -gt 30 ]; then
            export CALEB_VOICE_ID="WVwVlhKdnZoCuTIoxjYr"
          fi

          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          else
            ARGS="--render --publish-mode postNow"
          fi
          
          if [ "${{ github.event.inputs.format }}" = "reel" ]; then
            ARGS="$ARGS --type reel"
          elif [ "${{ github.event.inputs.format }}" = "carousel" ]; then
            ARGS="$ARGS --type carousel"
          fi

          if [ -n "${{ github.event.inputs.template }}" ]; then
            TEMPLATE_NUM="${{ github.event.inputs.template }}"
            TEMPLATE_IDX=$((TEMPLATE_NUM - 1))
            ARGS="$ARGS --template $TEMPLATE_IDX"
          fi

          echo "Running automator with args: $ARGS"
          node scripts/lira_content_automator.js $ARGS

      - name: Upload Rendered Media Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lira-rendered-content-${{ github.run_id }}
          path: |
            out/current_reel/*.mp4
            out/current_carousel/*.jpg
            data/reels/*.json
            public/assets/generated_reels/*.json
          if-no-files-found: ignore

      - name: Commit & Push Updated Content Ledger & Generated Configs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/content_ledger.json data/reels/ src/active_reel_manifest.json public/assets/generated_reels/
          if git diff --staged --quiet; then
            echo "No ledger changes to commit."
          else
            git commit -m "chore(engine): update content ledger and generated reel configs [skip ci]"
            git push
          fi
